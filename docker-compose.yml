version: '3.8'

services:
  # Mosquitto MQTT Broker
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: nexasmart-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: nexasmart-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: nexasmart
    volumes:
      - mongo_data:/data/db

  # NexaSmart Backend API & WebSocket Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexasmart-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password123@mongodb:27017/nexasmart?authSource=admin
      JWT_SECRET: nexasmart_super_secret_jwt_key_production_2026_xyz
      JWT_REFRESH_SECRET: nexasmart_refresh_token_secret_key_production_2026_abc
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      EMBEDDED_MQTT: "false"
    depends_on:
      - mongodb
      - mosquitto

  # NexaSmart Frontend UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexasmart-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
